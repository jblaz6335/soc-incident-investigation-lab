[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-incident-investigation-lab"
version = "1.0.0"
description = "A lightweight SOC investigation portfolio project for Windows security telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joshua Hernandez" }]
keywords = ["cybersecurity", "soc", "incident-response", "sigma", "windows-event-logs"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
evtx = ["python-evtx>=0.8.1,<1"]
dev = [
  "python-evtx>=0.8.1,<1",
  "PyYAML>=6.0.3,<7",
  "ruff>=0.16.2,<1",
]

[project.scripts]
soc-lab = "soc_lab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
