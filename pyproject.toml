[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-incident-investigation-lab"
version = "1.0.0"
description = "A lightweight SOC investigation portfolio project for Windows security telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joshua Hernandez" }]
keywords = ["cybersecurity", "soc", "incident-response", "sigma", "windows-event-logs"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
soc-lab = "soc_lab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

